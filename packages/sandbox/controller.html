<title>Proxy Sandbox Controller</title>
<script>
	let pendingMessages = [];

	function wake(controller) {
		window.parent.postMessage({ $sandboxsw$type: "ready" }, "*");
		for (const [data, ports] of pendingMessages.splice(0)) {
			controller.postMessage(data, ports);
		}
	}
	navigator.serviceWorker
		.register("/sw.js", {
			scope: "/",
		})
		.then(async () => {
			if (!navigator.serviceWorker.controller) {
				await new Promise((resolve, reject) => {
					const timeout = setTimeout(
						() =>
							reject(new Error("Sandbox service worker did not take control")),
						10000
					);
					navigator.serviceWorker.addEventListener(
						"controllerchange",
						() => {
							clearTimeout(timeout);
							resolve();
						},
						{ once: true }
					);
				});
			}
			if (!navigator.serviceWorker.controller) {
				throw new Error("Sandbox service worker did not take control");
			}
			wake(navigator.serviceWorker.controller);
		})
		.catch((error) => {
			console.error("Service Worker registration failed:", error);
			window.parent.postMessage(
				{ $sandboxsw$type: "initerror", message: error.message },
				"*"
			);
		});

	// chrome -> controller -> service worker
	window.addEventListener("message", (event) => {
		if (!navigator.serviceWorker.controller) {
			pendingMessages.push([event.data, event.ports]);
			return;
		}

		// forward messageport
		navigator.serviceWorker.controller.postMessage(event.data, event.ports);
	});
	navigator.serviceWorker.addEventListener("controllerchange", () => {
		const controller = navigator.serviceWorker.controller;
		if (!controller) return;
		for (const [data, ports] of pendingMessages.splice(0)) {
			controller.postMessage(data, ports);
		}
	});

	// service worker -> controller -> chrome
	// the sandbox SW broadcasts $controller$swrevive when it activates so that
	// the chrome controller can re-establish its message port. since the chrome
	// is at a different origin from this SW it can't listen directly, so we
	// forward the revive notification up to the parent.
	navigator.serviceWorker.addEventListener("message", (event) => {
		if (!event.data || typeof event.data !== "object") return;
		if (event.data.$controller$swrevive) {
			window.parent.postMessage({ $controller$swrevive: {} }, "*");
		}
	});
</script>
